<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FeedMe, in browser podcast reader and player</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- The above 3 meta tags *must* come first in the head; any other head content must come *after* these tags -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23ff6600'/%3E%3Ccircle cx='4' cy='12' r='1.5' fill='%23fff'/%3E%3Cpath d='M3 7.5a5.5 5.5 0 0 1 5.5 5.5' fill='none' stroke='%23fff' stroke-width='1.5'/%3E%3Cpath d='M3 4a9 9 0 0 1 9 9' fill='none' stroke='%23fff' stroke-width='1.5'/%3E%3C/svg%3E"/>
    <!-- Bootstrap -->
    <link rel="stylesheet" href="static/feedme/bootstrap.css"/>
    <link rel="stylesheet" href="static/feedme/bootstrap-theme.css"/>
    <link rel="stylesheet" href="static/feedme/normalize.css"/>
    <link rel="stylesheet" href="static/feedme/app.css"/>
    <!-- Need jQuery to run Javascript class -->
    <script type="text/javascript" src="static/feedme/jquery-3.7.1.min.js"></script>
    <script type="text/javascript" src="static/feedme/bootstrap.js"></script>
    <script type="text/javascript" src="static/feedme/feedme-3.0.js"></script>
    <script type="text/javascript">
        jQuery(function ($) {
            $.feedRead({
                itunes: true, //podcast url
                manifest: 'podcasts/feeds.json',
                feed_list: '#podcast',
                feed: '#playlist',
                channel: '#chan_info',
                channel_details: '#chan_details',
                updated: '#chan_updated',
                item: '#item_info',
                modal: '#feedInfoModal',
                modal_body: '#feedModalBody'
            });
        });
    </script>
</head>
<body>
    <nav class="navbar navbar-default navbar-fixed-top">
        <div class="container-fluid">
            <div class="navbar-layout">
                <div class="navbar-left-col">
                    <!-- Brand and toggle get grouped for better mobile display -->
                    <div class="navbar-header">
                        <button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#menu" aria-expanded="false">
                            <span class="sr-only">Toggle navigation</span>
                            <span class="icon-bar"></span>
                            <span class="icon-bar"></span>
                            <span class="icon-bar"></span>
                        </button>
                        <a href="#" class="navbar-brand">FeedMe 3.0</a>
                    </div>
                    <!-- Collect the nav links, forms, and other content for toggling -->
                    <div class="collapse navbar-collapse" id="menu">
                        <ul class="nav navbar-nav nav-tabs">
                            <li class="active">
                                <a data-toggle="tab" href="#home" title="Home">
                                    <span class="glyphicon glyphicon-home"></span>
                                </a>
                            </li>
                            <li>
                                <a data-toggle="tab" href="#chan" title="Podcasts &amp; Episodes">
                                    <span class="glyphicon glyphicon-globe"></span>
                                </a>
                            </li>
                        </ul>
                    </div><!-- /.navbar-collapse -->
                </div>
                <div id="chan_info" class="navbar-channel-title"></div>
            </div>
        </div><!-- /.container-fluid -->
    </nav>

    <div class="container-fluid">
        <div class="tab-content">
            <!-- Home Tab: Cached Podcasts on Left, Tall Banner on Right -->
            <div id="home" class="tab-pane fade in active">
                <div class="row">
                    <div class="col-md-3 col-sm-4">
                        <div class="panel panel-default">
                            <div class="panel-heading">
                                <h4 class="panel-title">
                                    <span class="glyphicon glyphicon-list" aria-hidden="true"></span> Podcasts
                                </h4>
                            </div>
                            <div class="panel-body">
                                <div class="input-group input-group-sm" style="margin-bottom: 10px;">
                                    <span class="input-group-addon"><span class="glyphicon glyphicon-search"></span></span>
                                    <input type="text" id="searchPodcast" class="form-control" placeholder="Filter Podcasts" />
                                </div>
                                <ul id="podcast">
                                    <li>
                                        <ul id="files" class="nav nav-pills nav-stacked"></ul>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-9 col-sm-8">
                        <div class="jumbotron feedme-hero">
                            <img src="static/feedme.jpg" alt="FeedMe, in browser podcast reader and player" class="img-responsive center-block feedme-banner" />
                        </div>
                    </div>
                </div>
            </div>

            <!-- Globe Tab: 40% Episode List on Left + 60% Current Episode on Right -->
            <div id="chan" class="tab-pane fade">
                <div class="chan-layout">
                    <div class="chan-episodes-col">
                        <div class="panel panel-default">
                            <div class="panel-heading clearfix">
                                <strong>Updated:</strong> <span id="chan_updated" class="text-muted">—</span>
                                <div class="pull-right">
                                    <button type="button" class="btn btn-xs btn-default open-feed-modal" data-inspector-tab="channel" title="Channel &amp; Episode Data">
                                        <span class="glyphicon glyphicon-info-sign"></span>
                                    </button>
                                    <a href="#" id="reorder_playlist" class="btn btn-xs btn-default" title="Reverse Episode Order">
                                        <span class="glyphicon glyphicon-sort"></span>
                                    </a>
                                </div>
                            </div>
                            <div class="panel-body">
                                <div id="chan_details" class="chan-details">
                                    <p class="text-muted">Select a podcast from the Home tab to load its episodes.</p>
                                </div>
                                <hr />
                                <div class="input-group input-group-sm" style="margin-bottom: 10px;">
                                    <span class="input-group-addon"><span class="glyphicon glyphicon-search"></span></span>
                                    <input type="text" id="searchEpisode" class="form-control" placeholder="Filter Episodes" />
                                </div>
                                <ul id="playlist" class="nav nav-pills nav-stacked"></ul>
                            </div>
                        </div>
                    </div>
                    <div id="item_info" class="chan-player-col">
                        <div class="alert alert-info">
                            <strong>No podcast loaded.</strong> Choose a podcast on the Home tab to browse and play episodes.
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Feed Data Pop-up Modal (Channel Tab + Episode Tab) -->
    <div class="modal fade" id="feedInfoModal" tabindex="-1" role="dialog" aria-labelledby="feedInfoModalLabel">
        <div class="modal-dialog modal-lg" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
                    <h4 class="modal-title" id="feedInfoModalLabel">
                        <span class="glyphicon glyphicon-info-sign"></span> Feed Data
                    </h4>
                </div>
                <div class="modal-body" id="feedModalBody"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
